<!doctype html><html lang="es"><meta charset="utf-8"><title>Revisión HEAT</title><style>body{margin:0;background:#deded8;font:12px sans-serif}nav{padding:8px;display:flex;gap:8px}button{padding:8px}iframe{display:block;transform-origin:top left;border:0}#stage{overflow:hidden}#report{display:none}</style><nav><button onclick="size(1440,1050)">Escritorio</button><button onclick="size(900,1100)">Tablet</button><button onclick="size(390,844)">Móvil 390</button><button onclick="size(320,700)">Móvil 320</button><button onclick="inspect()">Verificar</button></nav><pre id="report"></pre><div id="stage"><iframe id="preview" src="/" title="Revisión del ranking"></iframe></div><script>
const frame=document.querySelector('#preview');
function size(w,h){frame.style.width=w+'px';frame.style.height=h+'px';const scale=Math.min(1,(innerWidth-16)/w,(innerHeight-65)/h);frame.style.transform=`scale(${scale})`;document.querySelector('#stage').style.height=h*scale+'px';requestAnimationFrame(()=>{const d=frame.contentDocument;d.documentElement.style.scrollBehavior='auto';frame.contentWindow.scrollTo({top:d.querySelector('#rankings').offsetTop,behavior:'instant'})});}
function inspect(){const d=frame.contentDocument;const section=d.querySelector('#rankings');document.querySelector('#report').textContent=JSON.stringify({width:d.documentElement.clientWidth,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,playerLoaded:d.querySelector('.rankings__player').naturalWidth>0,players:d.querySelectorAll('.rankings__podium-place, .rankings__table tbody tr').length,podium:d.querySelectorAll('.rankings__podium-place').length,exampleLabel:section.textContent.toLowerCase().includes('ejemplo'),ballWidth:d.querySelector('.section-label__ball').getBoundingClientRect().width,tableOverflow:d.querySelector('.rankings__table').scrollWidth>d.querySelector('.rankings__table').clientWidth,sectionHeight:section.offsetHeight});}
frame.onload=()=>size(1440,1050);
</script></html>
