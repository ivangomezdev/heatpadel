<!doctype html><html lang="es"><meta charset="utf-8"><title>HEAT · Revisión responsive</title>
<style>body{margin:0;background:#deded8;font:12px sans-serif}nav{padding:8px;display:flex;gap:7px;flex-wrap:wrap}button{padding:8px}iframe{display:block;transform-origin:top left;border:0}#stage{overflow:hidden}pre{white-space:pre-wrap;font:11px monospace;margin:8px}</style>
<nav><button onclick="size(1440,1100)">Escritorio</button><button onclick="size(390,844)">Móvil 390</button><button onclick="size(320,740)">Móvil 320</button><button onclick="go('/dashboard')">Dashboard</button><button onclick="go('/registro')">Registro</button><button onclick="go('/')">Landing</button><button onclick="jump('.court-picker__hours')">Horarios</button><button onclick="jump('.booking-summary')">Resumen</button><button onclick="jump('header')">Arriba</button><button onclick="report()">Verificar ancho</button></nav><pre id="report">Cargando…</pre><div id="stage"><iframe id="preview" src="/dashboard" title="Vista de HEAT"></iframe></div>
<script>
const frame=document.querySelector('#preview');let width=1440,height=1100;
function size(w,h){width=w;height=h;frame.style.width=w+'px';frame.style.height=h+'px';const scale=Math.min(1,(innerWidth-16)/w,(innerHeight-115)/h);frame.style.transform=`scale(${scale})`;document.querySelector('#stage').style.height=h*scale+'px';setTimeout(report,300);}
function go(path){frame.src=path;}
function jump(selector){frame.contentDocument.querySelector(selector)?.scrollIntoView({block:'start',behavior:'instant'});}
function report(){const d=frame.contentDocument;document.querySelector('#report').textContent=JSON.stringify({width:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,page:d.title,brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).length});}
frame.onload=()=>{size(width,height);setTimeout(report,1000);};
</script></html>
